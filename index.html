<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trip Expenses</title>

<link rel="stylesheet" href="style.css">
</head>


<body>

<div class="container">

<h1>🏝️ Trip Expenses</h1>


<h2>People</h2>
<div id="people"></div>


<hr>


<h2>Add Expense</h2>


<input 
    id="description"
    type="text"
    placeholder="What was it?"
    autocomplete="off"
>


<input 
    id="amount"
    type="number"
    step="0.01"
    placeholder="Amount (€)"
>


<select id="payer">
</select>


<button class="add-button" onclick="addExpense()">
    ➕ Add Expense
</button>


<hr>


<h2>Expenses</h2>

<div id="expenses">
</div>


<hr>


<h2>Balances</h2>

<div id="balances">
</div>


</div>


<script src="app.js"></script>

</body>

</html>
